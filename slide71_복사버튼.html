<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>71번 슬라이드 - 실습 노트 복사</title>
<style>
  :root { --bg:#0B1220; --card:#141C33; --lime:#D4FF3D; --coral:#FF6B5B; --muted:#B8C0D4; }
  html,body { margin:0; height:100%; background:#060B16; font-family:'Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif; }
  body { display:flex; align-items:center; justify-content:center; padding:2vh 0; box-sizing:border-box; }

  /* 슬라이드 프레임: 70번과 같은 어두운 카드 */
  .s71 { font-size:clamp(12px,1.05vw,20px); width:min(1460px,92vw); background:var(--bg); color:#fff;
         border:1px solid #1C2745; border-radius:14px; padding:2.4em 3.2em 1.6em; box-sizing:border-box; }
  .s71 * { box-sizing:border-box; }
  .s71 .kicker { color:var(--lime); font-weight:800; font-size:1.25em; margin:0 0 .5em; }
  .s71 h2 { font-size:3.3em; line-height:1.15; margin:0 0 .25em; font-weight:800; }
  .s71 .sub { color:var(--muted); font-size:1.7em; margin:0 0 .8em; }

  .s71 .table { display:grid; gap:.4em; }
  .s71 .tr { display:grid; grid-template-columns:2.2fr 1.9fr 1fr 1.5fr 1.2fr; align-items:center; padding:.55em 1.1em; border-radius:.55em; font-size:1.7em; font-weight:800; }
  .s71 .th { background:var(--card); color:var(--muted); padding-top:.45em; padding-bottom:.45em; }
  .s71 .td { background:var(--lime); color:var(--bg); }
  .s71 .copy { justify-self:end; background:var(--bg); color:var(--lime); border:0; border-radius:.45em; font:inherit; font-size:.8em;
               padding:.3em 1em; cursor:pointer; }
  .s71 .copy:hover { filter:brightness(1.25); }
  .s71 .copy.done { background:#fff; color:var(--bg); }

  .s71 .note { color:var(--muted); font-size:1.5em; margin:.8em 0 .6em; }
  .s71 .boxes { display:grid; grid-template-columns:1fr 1fr; gap:1em; }
  .s71 .box { border-radius:.7em; padding:.9em 1.2em; font-size:1.55em; font-weight:800; line-height:1.4; text-align:center; display:flex; align-items:center; justify-content:center; min-height:3.6em; }
  .s71 .box.a { background:var(--card); border:1px solid #27345C; }
  .s71 .box.b { background:#1F2A1C; border:1px solid #6B8A1F; color:var(--lime); }
  .s71 .foot { display:flex; justify-content:space-between; gap:1em; margin-top:1em; color:var(--muted); font-size:1.05em; }
  .s71 .foot .warn { color:var(--coral); font-weight:700; }
  @media (max-width:760px){ .s71 .tr { grid-template-columns:1.6fr 1.4fr .9fr 1.3fr 1fr; font-size:1.2em; } .s71 .boxes{grid-template-columns:1fr;} }
</style>
</head>
<body>

<section class="s71">
  <p class="kicker">속성 활용 3 / 4 · 실습</p>
  <h2>노트 4장에 속성 세 줄만 적습니다</h2>
  <p class="sub">[복사] → 빈 노트 맨 위에 붙여넣기 (Ctrl+V)</p>

  <div class="table" id="s71-table">
    <div class="tr th"><span>노트 이름</span><span>type</span><span>status</span><span>date</span><span style="justify-self:end">속성 세 줄</span></div>
  </div>

  <p class="note">폴더 <b>실습</b> 만들기 → 노트 4장 만들기 → 노트마다 [복사] 후 붙여넣기</p>

  <div class="boxes">
    <div class="box a">다 붙였으면: Ctrl+P → 베이스: 새 베이스 생성하기</div>
    <div class="box b">필터에 status = 초안 추가 → 2장만 남으면 성공</div>
  </div>

  <div class="foot">
    <span class="warn">안 될 때: 맨 첫 줄이 --- 인지, type: 뒤에 한 칸 띄웠는지 확인</span>
    <span>옵시디언 속성 · AI 활용 행정세미나 · 활용 3 / 4 · 실습</span>
  </div>
</section>

<script>
(function () {
  var notes = [
    ['정책보고서_A', '정책보고서', '초안', '2026-09-01'],
    ['회의록_B',     '회의록',     '완료', '2026-09-05'],
    ['정책보고서_C', '정책보고서', '초안', '2026-09-10'],
    ['업무계획_D',   '업무계획',   '보류', '2026-09-15']
  ];
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
  var table = document.getElementById('s71-table');
  notes.forEach(function (n) {
    var text = '---\ntype: ' + n[1] + '\nstatus: ' + n[2] + '\ndate: ' + n[3] + '\n---\n';
    var row = document.createElement('div');
    row.className = 'tr td';
    row.innerHTML = '<span>' + n[0] + '</span><span>' + n[1] + '</span><span>' + n[2] + '</span><span>' + n[3] + '</span>';
    var btn = document.createElement('button');
    btn.className = 'copy'; btn.textContent = '복사';
    btn.addEventListener('click', function () {
      var done = function () {
        btn.textContent = '복사됨 ✓'; btn.classList.add('done');
        setTimeout(function () { btn.textContent = '복사'; btn.classList.remove('done'); }, 1500);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
      } else { fallbackCopy(text); done(); }
    });
    row.appendChild(btn);
    table.appendChild(row);
  });
})();
</script>
</body>
</html>
