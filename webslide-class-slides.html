<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>노트 한 장이 슬라이드 한 장이 된다 — 6시간 실습 웹슬라이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1220;--card:#141C33;--lime:#D4FF3D;--coral:#FF6B5B;--text:#F6F3EC;--muted:#A9AEBB;--line:#293045}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#deck{position:fixed;inset:0}
.slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:5vh 6vw 10vh}
.slide.on{display:flex;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kicker{color:var(--lime);font-weight:700;letter-spacing:.12em;font-size:clamp(12px,1.4vw,19px);margin-bottom:1.6vh}
h1{font-size:clamp(34px,7vw,104px);font-weight:900;line-height:1.15;letter-spacing:-.03em}
h2{font-size:clamp(26px,4.2vw,62px);font-weight:900;line-height:1.25;letter-spacing:-.02em}
h3{font-size:clamp(18px,2.3vw,32px);font-weight:700}
p,li{font-size:clamp(16px,2.1vw,30px);line-height:1.5}
.sub{color:var(--muted);margin-top:2vh;font-size:clamp(14px,1.8vw,26px)}
.lime{color:var(--lime)}.coral{color:var(--coral)}.muted{color:var(--muted)}
ul,ol{list-style:none}
li{padding:.7vh 0 .7vh 1.5em;position:relative}
li::before{content:"";position:absolute;left:0;top:calc(.7vh + .55em);width:.45em;height:.45em;border-radius:50%;background:var(--lime)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.6vw;margin-top:2.4vh}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2vh 1.6vw}
.card.p{border-top:5px solid var(--coral)}.card.s{border-top:5px solid var(--lime)}
.card b{display:block;font-size:clamp(16px,2vw,28px);margin-bottom:.5vh}
.card span{color:var(--muted);font-size:clamp(13px,1.6vw,22px);line-height:1.5;display:block}
.flow{display:flex;align-items:center;gap:1.2vw;flex-wrap:wrap;margin-top:3vh}
.flow .card{min-width:13vw;text-align:center}
.flow i{font-style:normal;color:var(--lime);font-size:clamp(24px,3.4vw,48px);font-weight:900}
.hl{border-color:var(--lime)!important;box-shadow:0 0 0 3px rgba(212,255,61,.14)}
.big{font-size:clamp(30px,5.4vw,80px);font-weight:900;line-height:1.28;letter-spacing:-.02em}
.bar{width:11vw;height:.8vh;background:var(--lime);margin-top:2vh;border-radius:4px}
.tag{display:inline-block;font-size:clamp(12px,1.3vw,17px);font-weight:700;border-radius:8px;padding:.3vh .8vw;margin-bottom:1.6vh;background:rgba(212,255,61,.14);color:var(--lime);align-self:flex-start}
.tag.q{background:rgba(255,107,91,.16);color:var(--coral)}
.tag.t{background:#293045;color:var(--text)}
pre,.prm{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.8vh 1.6vw;font-family:Consolas,'Courier New','Noto Sans KR',monospace;font-size:clamp(12px,1.55vw,22px);line-height:1.6;white-space:pre-wrap;color:var(--text);margin-top:1.4vh}
.copy{margin-top:1.4vh;align-self:flex-start;background:var(--lime);color:#0B1220;border:0;border-radius:10px;font:900 clamp(12px,1.5vw,19px) 'Noto Sans KR',sans-serif;padding:1vh 1.6vw;cursor:pointer}
code{font-family:Consolas,monospace;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:0 .35em;font-size:.88em}
.contrib{background:var(--lime);color:#0B1220;border-radius:20px;padding:4.5vh 3.6vw}
.contrib .kicker{color:#0B1220}.contrib li::before{background:#0B1220}.contrib li{font-weight:700}
.note{position:fixed;left:6vw;right:12vw;bottom:2vh;color:var(--muted);font-size:clamp(11px,1.15vw,15px);line-height:1.5}
.note b{color:var(--lime)}
body.nonote .note{display:none}
#bar{position:fixed;left:0;top:0;height:4px;background:var(--lime);width:0;transition:width .3s;z-index:9}
#pg{position:fixed;right:1.6vw;bottom:2vh;color:var(--muted);font-size:clamp(11px,1.2vw,15px);z-index:9}
.part{position:fixed;left:6vw;top:2vh;color:var(--muted);font-size:clamp(11px,1.15vw,15px);z-index:9}
.nav{position:fixed;top:12vh;bottom:12vh;width:8vw;z-index:5;cursor:pointer}
.nav.l{left:0}.nav.r{right:0}
/* split layout */
.split{display:grid;grid-template-columns:1.45fr 1fr;gap:2.2vw;align-items:center;margin-top:1.6vh}
.steps li{padding-left:0}.steps li::before{display:none}
.steps li{display:flex;gap:.8vw;align-items:flex-start;font-size:clamp(13px,1.65vw,24px);padding:.6vh 0}
.no{display:inline-flex;flex:none;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--coral);color:#fff;font:900 .78em 'Noto Sans KR',sans-serif;font-style:normal;margin:0 .2em}
.steps .no{margin:.05em 0 0 0}
/* mock windows */
.win{border-radius:12px;overflow:hidden;border:1px solid #3a4258;background:#fff;color:#222;box-shadow:0 12px 40px rgba(0,0,0,.45);font-size:clamp(10px,1.28vw,17px);line-height:1.5}
.win.dark{background:#1e1e1e;color:#dcddde;border-color:#444}
.win.gh{background:#0d1117;color:#e6edf3;border-color:#30363d}
.win.vc{background:#000;color:#ededed;border-color:#333}
.wbar{display:flex;align-items:center;gap:.4em;padding:.5em .8em;background:#e9e9ee;border-bottom:1px solid #d0d0d8}
.dark .wbar,.gh .wbar,.vc .wbar{background:#2a2a2a;border-color:#3a3a3a}
.wbar i{width:.7em;height:.7em;border-radius:50%;background:#ff5f57}.wbar i:nth-child(2){background:#febc2e}.wbar i:nth-child(3){background:#28c840}
.wt{margin-left:.8em;font-size:.9em;opacity:.8}
.url{margin:.5em .8em;padding:.25em .9em;border-radius:99px;background:#f1f1f5;color:#444;font-size:.92em;font-family:Consolas,monospace}
.dark .url,.gh .url,.vc .url{background:#2d2d2d;color:#bbb}
.wbody{padding:0;position:relative}
.obs{display:grid;grid-template-columns:30% 1fr;min-height:30vh}
.side{background:#262626;padding:.8em .6em;border-right:1px solid #3a3a3a;font-size:.95em}
.ti{padding:.12em .4em;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti.on{background:#3b3563;color:#fff}.ti.bad{color:#ff8a7d}.ti.ok{color:#d4ff3d}.ti.dim{opacity:.55}
.ed{padding:1em 1.3em;font-family:'Noto Sans KR',sans-serif}
.ln{padding:.05em 0}.mk{color:#8b6cef;margin-right:.1em}
.h1{font-size:1.5em;font-weight:900;color:#fff}.h2{font-size:1.2em;font-weight:700;color:#e8e8ff}.h3{font-weight:700}
.ed mark{background:rgba(255,107,91,.28);color:#ffb3aa;border-radius:3px;padding:0 .15em}
.ed em.ok{font-style:normal;background:rgba(212,255,61,.2);color:#d4ff3d;border-radius:3px;padding:0 .15em}
.pad{padding:1em 1.2em}
.gh-nav{display:flex;gap:1em;align-items:center;padding:.7em 1em;background:#161b22;border-bottom:1px solid #30363d}
.gh-nav .lg{width:1.6em;height:1.6em;border-radius:50%;background:#e6edf3}
.gh-tabs{display:flex;gap:1.4em;padding:.5em 1em;border-bottom:1px solid #30363d;color:#9da7b3}.gh-tabs .on{color:#fff;border-bottom:2px solid #f78166;padding-bottom:.3em}
.bg{display:inline-block;padding:.3em .9em;border-radius:7px;font-weight:700;border:1px solid #3d444d;background:#21262d;color:#e6edf3;margin:.2em .2em .2em 0}
.bg.grn{background:#238636;border-color:#2ea043;color:#fff}
.menu{display:inline-block;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:.3em 0;margin-top:.3em;min-width:12em}.menu div{padding:.3em 1em}.menu .on{background:#1f6feb;color:#fff}
.inp{border:1px solid #3d444d;background:#0d1117;border-radius:7px;padding:.4em .8em;margin:.3em 0;color:#e6edf3}
.fl{display:flex;justify-content:space-between;padding:.45em 1em;border-top:1px solid #30363d}
.drop{margin:1em;border:2px dashed #3d444d;border-radius:12px;padding:2.2em 1em;text-align:center;color:#9da7b3}
.chat{padding:1em 1.2em;background:#faf9f5;color:#2a2a28;min-height:30vh}
.msg-u{background:#ece9df;border-radius:14px;padding:.7em 1em;margin:.4em 0 .8em auto;max-width:82%;white-space:pre-wrap}
.msg-a{padding:.3em .2em;max-width:92%}
.code{background:#1f1f1f;color:#e6e6e6;border-radius:9px;padding:.7em 1em;font-family:Consolas,monospace;font-size:.92em;margin-top:.5em;white-space:pre-wrap}
.code .c{color:#7ec699}.code .k{color:#c586c0}.code .s{color:#ce9178}
.inbox{display:flex;gap:.6em;align-items:center;border:1px solid #cfcab8;background:#fff;border-radius:12px;padding:.6em 1em;margin:.8em 0 0;color:#666}
.send{margin-left:auto;background:#d97757;color:#fff;border-radius:8px;padding:.2em .8em;font-weight:700}
.nt{background:#fff;color:#222;font-family:Consolas,monospace;padding:.8em 1em;min-height:18vh;white-space:pre-wrap}
.dlg{padding:.8em 1.2em;background:#f3f3f3;color:#222}
.dlg .f{display:flex;gap:.8em;align-items:center;margin:.4em 0}.dlg .f span{width:6.5em;color:#555}.dlg .f div{flex:1;border:1px solid #aaa;background:#fff;padding:.2em .6em}
.vc-card{border:1px solid #333;border-radius:10px;padding:.8em 1em;margin:.5em 1em;background:#0a0a0a}
.vc-btn{display:inline-block;background:#ededed;color:#000;font-weight:700;border-radius:7px;padding:.35em 1em}
.ok-box{background:#0f2a1a;border:1px solid #1f6b3c;color:#6ee7a0;border-radius:8px;padding:.5em 1em;margin:.5em 1em}
.err-box{background:#2a1010;border:1px solid #7a2323;color:#ff9b93;border-radius:8px;padding:.5em 1em;margin:.5em 1em}
.mini-slide{display:inline-block;width:30%;aspect-ratio:16/9;border-radius:6px;background:#0B1220;color:#F6F3EC;font-size:.8em;padding:.5em;margin:.3em;vertical-align:top;border:1px solid #444}
.mini-slide b{color:#D4FF3D;display:block}
.cap{font-size:clamp(10px,1.1vw,14px);color:var(--muted);margin-top:.8vh;text-align:right}
.tbl{width:100%;border-collapse:collapse;margin-top:1.6vh}
.tbl th,.tbl td{border:1px solid var(--line);padding:.9vh 1vw;text-align:left;font-size:clamp(12px,1.55vw,22px);vertical-align:top}
.tbl th{background:var(--card);color:var(--lime)}
.timer{display:inline-block;border:2px solid var(--lime);color:var(--lime);border-radius:99px;padding:.3vh 1.4vw;font-weight:900;font-size:clamp(14px,1.8vw,26px);margin-bottom:1.6vh;align-self:flex-start}
@media(max-width:820px){.split{grid-template-columns:1fr}.slide{padding:6vh 5vw 12vh;overflow:auto}}
</style>
</head>
<body>
<div id="bar"></div><div class="part" id="part"></div>
<div id="deck"></div>
<div class="nav l" id="prev"></div><div class="nav r" id="next"></div>
<div id="pg"></div>
<script>
const S=[];
let PART='';
const add=(html,note)=>S.push({html,note:note||'',part:PART});
const setPart=p=>{PART=p};
/* ---- helpers ---- */
const win=(title,body,o={})=>`<div class="win ${o.t||''}"><div class="wbar"><i></i><i></i><i></i><span class="wt">${title}</span></div>${o.url?`<div class="url">${o.url}</div>`:''}<div class="wbody">${body}</div></div><div class="cap">화면 예시 · 실제 화면은 버전에 따라 조금 다를 수 있습니다</div>`;
const no=n=>`<b class="no">${n}</b>`;
const md=t=>t.split('\n').map(l=>{let m;
  if(m=l.match(/^(#{1,3}) (.*)/))return `<div class="ln"><span class="mk">${m[1]}</span> <span class="h${m[1].length}">${m[2]}</span></div>`;
  if(m=l.match(/^- (.*)/))return `<div class="ln"><span class="mk">-</span> ${m[1]}</div>`;
  return `<div class="ln">${l||'&nbsp;'}</div>`}).join('');
const tree=a=>a.map(([t,d,c])=>`<div class="ti ${c||''}" style="padding-left:${.4+d*1.1}em">${t}</div>`).join('');
const obs=(tr,ed)=>win('Obsidian — 나교수-볼트',`<div class="obs"><div class="side">${tree(tr)}</div><div class="ed">${ed}</div></div>`,{t:'dark'});
const brow=(url,body,t)=>win('Chrome',body,{url,t:t||''});
const steps=a=>`<ol class="steps">${a.map((s,i)=>`<li>${no(i+1)}<span>${s}</span></li>`).join('')}</ol>`;
const split=(k,t,mock,st)=>`<div class="kicker">${k}</div><h2>${t}</h2><div class="split"><div>${mock}</div><div>${steps(st)}</div></div>`;
const cards=(a,c)=>`<div class="cols">${a.map(([b,s])=>`<div class="card ${c||''}"><b>${b}</b><span>${s}</span></div>`).join('')}</div>`;
const stuck=(title,sym,cause,fix,extra)=>`<div class="kicker">막힘 → 해결</div><h2>${title}</h2><div class="cols"><div class="card p"><b class="coral">증상</b><span>${sym}</span></div><div class="card p"><b class="coral">원인</b><span>${cause}</span></div><div class="card s"><b class="lime">해결</b><span>${fix}</span></div></div>${extra||''}`;
const prm=t=>`<pre class="prm" data-copy="1">${t}</pre>`;
const Q=t=>`<span class="tag q">질문 · 7초 대기</span><div class="big">${t}</div>`;
const M=t=>`<span class="tag">이정표</span><div class="big">${t}</div>`;
const DIV=(n,t,s)=>`<div class="kicker">PART ${n}</div><h1>${t}</h1><p class="sub">${s}</p>`;
const PR=(m,t)=>`<span class="timer">실습 · ${m}분</span><h2>${t}</h2>`;
const splitN=(mock,st)=>`<div class="split"><div>${mock}</div><div>${steps(st)}</div></div>`;
/* ===== 오프닝 ===== */
setPart('오프닝');
add(`<div class="kicker">WEB SLIDE WORKSHOP · 6 HOURS</div><h1>노트 한 장이<br><span class="lime">슬라이드 한 장</span>이 된다</h1><p class="sub">옵시디언 노트를 웹슬라이드로 · 대학생·대학원생 · 나병인 박사</p>`,

const deck=document.getElementById('deck'),pg=document.getElementById('pg'),bar=document.getElementById('bar'),partEl=document.getElementById('part');
S.forEach((s,i)=>{const d=document.createElement('section');d.className='slide';d.innerHTML=s.html+(s.note?`<div class="note">${s.note}</div>`:'');deck.appendChild(d)});
document.querySelectorAll('pre[data-copy]').forEach(pre=>{const b=document.createElement('button');b.className='copy';b.textContent='프롬프트 복사';
  b.onclick=e=>{e.stopPropagation();const t=pre.innerText;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent='복사됨'},()=>{const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='선택됨 · Ctrl+C'});setTimeout(()=>{b.textContent='프롬프트 복사'},2500)};
  pre.after(b)});
let cur=0;
function show(n){cur=Math.max(0,Math.min(S.length-1,n));
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('on',i===cur));
  pg.textContent=(cur+1)+' / '+S.length;bar.style.width=((cur+1)/S.length*100)+'%';partEl.textContent=S[cur].part;
  try{history.replaceState(null,'','#'+(cur+1))}catch(e){}}
const go=d=>show(cur+d);
document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(1)}
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(-1)}
  else if(e.key==='Home')show(0);else if(e.key==='End')show(S.length-1);
  else if(e.key==='n'||e.key==='N')document.body.classList.toggle('nonote');
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}});
let x0=null;
document.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)go(dx<0?1:-1);x0=null},{passive:true});
window.addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1),10);if(n)show(n-1)});
show((parseInt(location.hash.slice(1),10)||1)-1);
</script>
