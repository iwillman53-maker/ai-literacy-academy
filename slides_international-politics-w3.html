<style>

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;

.hit:hover,.hit:focus-visible{opacity:.75}
#hp{left:0;text-align:left;padding-left:.8rem}#hn{right:0;text-align:right;padding-right:.8rem}
#prog{flex:1;height:8px;background:var(--line);border-radius:5px;cursor:pointer;position:relative;min-width:60px}

#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--lime);border-radius:5px}
#cnt{min-width:4.6rem;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
#cap{position:absolute;left:-9999px}
#grid{position:fixed;inset:0;z-index:10;display:none;overflow:auto;padding:1rem;background:rgba(11,18,32,.97)}
#grid.on{display:block}
#grid h2{font-size:1.2rem;font-weight:900;margin:.2rem 0 1rem;display:flex;align-items:center;gap:1rem}
#gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.8rem}
#gl button{position:relative;padding:0;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);cursor:pointer;color:var(--text);text-align:left}
#gl button.cur,#gl button:hover{border-color:var(--lime)}
#gl img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
#gl span{display:block;padding:.35rem .6rem;font-size:.82rem;font-weight:700;line-height:1.35}
#gl b{color:var(--lime);margin-right:.35rem}
#pr{display:none}
#hush{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:rgba(11,18,32,.96);text-align:center;cursor:pointer;padding:1rem}
#hush.on{display:flex}
#hush .ic{font-size:clamp(4rem,16vw,9rem);line-height:1}
#hush h2{font-size:clamp(2.2rem,8vw,4.6rem);font-weight:900;color:var(--lime)}
#hush p{font-size:clamp(1rem,3vw,1.5rem);color:var(--sub)}
#hush .sec{font-size:clamp(3rem,10vw,6rem);font-weight:900;font-variant-numeric:tabular-nums}
#hush .hint{font-size:.9rem;color:var(--sub)}
@media (max-width:640px){.ttl small,.hide-s{display:none}.hit{width:30%}}
@media (prefers-reduced-motion:reduce){#frame img,.hit{transition:none}}
@page{size:16in 9in;margin:0}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  .bar,#stage,#grid,#hush,.hit{display:none!important}
  #pr{display:block}
  #pr img{display:block;width:16in;height:9in;object-fit:contain;page-break-after:always;break-after:page}
  #pr img:last-child{page-break-after:auto;break-after:auto}
}

<body>
<div class="bar top">
  <a class="btn" href="international-politics.html">← 강의 안내</a>
  <div class="ttl">바다 위의 농업제국, 스페인<small>글로벌시대의 국제정치 · 3주차</small></div>
  <span class="sp"></span>

</div>

  <h2>쉿~~</h2>

</div>
<div id="pr" aria-hidden="true"></div>
<p id="cap" role="status" aria-live="polite"></p>
<script>
(function(){
  var LS='ip3_', N=35;
  var TITLES=['표지 · 바다 위의 농업제국 스페인','오늘 강의 구성','오프닝 질문','Ch.1 이론 도입','패권이론 · 세계체제론','스페인 제국의 경제 구조','이베리아 반도의 지정학적 조건','대항해 시대 핵심 연표','Ch.2 스페인의 부상','레콘키스타의 유산','식민지 통치 4대 시스템','신대륙 발견의 충격','스페인 제국의 구조적 특성','식민지 착취 3대 제도','금은 독점 · 킨토 레알','카를로스 1세 · 합스부르크의 절정','합스부르크 결혼 외교','펠리페 2세 · 절정과 균열','무적함대 1588 · 패권의 균열','Ch.3 황금기와 모순','\'농업제국\'의 역설','쇠락의 4대 원인','가격혁명 · 풍요가 만든 빈곤','5차례 국가파산','상업혁신의 부재','스페인 패권의 종말','경쟁국의 부상','Ch.4 교훈과 시사점','3국 비교 · 패권 이동의 구조','자원의 저주','스페인의 교훈 5가지','현대적 함의','토론 주제','역사가들의 평가','강의 요약'];
  var $=function(i){return document.getElementById(i)};
  var img=$('img'),fill=$('fill'),cnt=$('cnt'),grid=$('grid'),gl=$('gl'),prog=$('prog'),cap=$('cap');
  var cur=1;
  function pad(n){return (n<10?'0':'')+n}
  function src(n){return 'intl-politics/w3/'+pad(n)+'.webp'}
  function store(v){try{localStorage.setItem(LS+'pos',v)}catch(e){}}
  function load(){try{return parseInt(localStorage.getItem(LS+'pos'),10)}catch(e){return NaN}}
  function go(n,noPush){
    cur=Math.max(1,Math.min(N,n));
    var p=new Image();
    img.classList.add('fade');
    p.onload=p.onerror=function(){img.src=src(cur);img.alt=cur+'. '+TITLES[cur-1];img.classList.remove('fade')};
    p.src=src(cur);
    fill.style.width=(cur/N*100)+'%';
    cnt.textContent=cur+' / '+N;
    prog.setAttribute('aria-valuenow',cur);
    prog.setAttribute('aria-valuetext',cur+'번, '+TITLES[cur-1]);
    cap.textContent=cur+'. '+TITLES[cur-1];
    if(!noPush){try{history.replaceState(null,'','#'+cur)}catch(e){}}
    store(cur);
    for(var k=cur+1;k<=cur+2&&k<=N;k++){new Image().src=src(k)}
    [].forEach.call(gl.children,function(b,i){b.classList.toggle('cur',i+1===cur)});
  }
  TITLES.forEach(function(t,i){
    var b=document.createElement('button');b.type='button';
    b.innerHTML='<img loading="lazy" alt="" src="'+src(i+1)+'"><span><b>'+(i+1)+'</b>'+t+'</span>';
    b.onclick=function(){closeGrid();go(i+1)};
    gl.appendChild(b);
  });
  function openGrid(){grid.classList.add('on');var c=gl.querySelector('.cur');if(c){c.scrollIntoView({block:'center'});c.focus()}}
  function closeGrid(){grid.classList.remove('on')}
  var hush=$('hush'),hs=$('hs'),ht=null;
  function hushOff(){hush.classList.remove('on');clearInterval(ht);ht=null}
  var actx=null;
  function shh(){
    try{
      var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      if(!actx)actx=new AC();
      if(actx.state==='suspended')actx.resume();
      var dur=1.5,sr=actx.sampleRate,buf=actx.createBuffer(1,Math.floor(sr*dur),sr),d=buf.getChannelData(0);
      for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      var src=actx.createBufferSource();src.buffer=buf;
      var hp=actx.createBiquadFilter();hp.type='highpass';hp.frequency.value=2500;
      var bp=actx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=5500;bp.Q.value=0.7;
      var g=actx.createGain(),t=actx.currentTime;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.9,t+0.3);
      g.gain.setValueAtTime(0.9,t+0.85);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      src.connect(hp);hp.connect(bp);bp.connect(g);g.connect(actx.destination);
      src.start(t);
    }catch(e){}
  }
  function hushOn(){
    shh();
    var n=7;hs.textContent=n;hush.classList.add('on');clearInterval(ht);
    ht=setInterval(function(){n--;if(n<=0){hs.textContent='끝';clearInterval(ht);ht=setTimeout(hushOff,900)}else{hs.textContent=n}},1000);
  }
  $('bh').onclick=function(){hush.classList.contains('on')?hushOff():hushOn()};
  hush.onclick=hushOff;
  function fs(){var d=document;if(d.fullscreenElement){d.exitFullscreen()}else if(d.documentElement.requestFullscreen){d.documentElement.requestFullscreen()}}
  function pdf(){
    var pr=$('pr');
    if(!pr.children.length){for(var k=1;k<=N;k++){var im=new Image();im.src=src(k);im.alt='';pr.appendChild(im)}}
    var imgs=[].slice.call(pr.children),t=0;
    (function wait(){var ok=imgs.every(function(i){return i.complete});if(ok||t++>60){window.print()}else{setTimeout(wait,150)}})();
  }
  $('hp').onclick=$('bpv').onclick=function(){go(cur-1)};
  $('hn').onclick=$('bnx').onclick=function(){go(cur+1)};
  $('bg').onclick=openGrid;$('gc').onclick=closeGrid;$('bf').onclick=fs;$('bp').onclick=pdf;
  prog.onclick=function(e){var r=prog.getBoundingClientRect();go(Math.ceil((e.clientX-r.left)/r.width*N))};
  prog.onkeydown=function(e){if(e.key==='ArrowRight'){e.preventDefault();go(cur+1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1)}};
  document.addEventListener('keydown',function(e){
    var k=e.key,gridOn=grid.classList.contains('on');
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if(k==='Escape'){closeGrid();hushOff();return}
    if(k==='s'||k==='S'){hush.classList.contains('on')?hushOff():hushOn();return}
    if(hush.classList.contains('on'))return;
    if(k==='g'||k==='G'){gridOn?closeGrid():openGrid();return}
    if(gridOn)return;
    var tag=(document.activeElement||{}).tagName;
    if((k===' '||k==='Enter')&&(tag==='BUTTON'||tag==='A'||document.activeElement===prog))return;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();go(cur+1)}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(cur-1)}
    else if(k==='Home')go(1);
    else if(k==='End')go(N);
    else if(k==='f'||k==='F')fs();
    else if(k==='p'||k==='P')pdf();
  });
  var sx=null;
  document.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  document.addEventListener('touchend',function(e){if(sx===null)return;var d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50&&!grid.classList.contains('on'))go(cur+(d<0?1:-1));sx=null});
  var h=parseInt(location.hash.slice(1),10);
  go(h>=1&&h<=N?h:(load()>=1?load():1),!(h>=1&&h<=N));
})();
</script>
<style>

/* 수업 시계 */
.clk{position:absolute;right:2.2cqi;bottom:1.8cqi;z-index:41;display:none;align-items:center;gap:.8cqi;background:rgba(16,18,22,.78);border:.12cqi solid #343a43;border-radius:99cqi;padding:.5cqi 1.4cqi;color:#eee;cursor:pointer;font-family:inherit}

#clkp{right:2.2cqi;bottom:6.4cqi;width:30cqi}
.toast{position:absolute;left:50%;top:3.2cqi;transform:translateX(-50%) translateY(-1cqi);z-index:95;background:var(--amber);color:#111;font-weight:900;font-size:2.4cqi;padding:1cqi 3cqi;border-radius:99cqi;box-shadow:0 1cqi 3cqi rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:all .3s;white-space:nowrap}

/* 펜 · 형광펜 · 레이저 */
canvas.pen{position:absolute;inset:0;width:100%;height:100%;z-index:60;pointer-events:none;touch-action:none}
canvas.pen.on{pointer-events:auto;cursor:crosshair}
.laser{position:absolute;z-index:61;width:2.2cqi;height:2.2cqi;margin:-1.1cqi 0 0 -1.1cqi;border-radius:50%;background:radial-gradient(circle,#fff 0,#ff3b30 35%,rgba(255,59,48,0) 72%);box-shadow:0 0 2cqi 1cqi rgba(255,59,48,.55);pointer-events:none;display:none}
.pbar{position:absolute;left:50%;bottom:1.6cqi;transform:translateX(-50%);z-index:80;display:none;align-items:center;gap:.7cqi;background:rgba(16,18,22,.95);border:.12cqi solid #343a43;border-radius:99cqi;padding:.7cqi 1.4cqi;color:#eee}

/* 손들기 투표 */
.poll{display:flex;flex-direction:column;gap:1.1cqi;width:100%}
.poll .polt{display:flex;align-items:center;justify-content:space-between;font-size:1.6cqi;color:var(--mute);font-weight:800}
.poll .polt b{color:var(--amber);font-size:2cqi}
.polrow{display:grid;grid-template-columns:16cqi 1fr 15cqi;gap:1.2cqi;align-items:center}
.polrow .plab{font-size:2.4cqi;font-weight:900;line-height:1.15}
.polrow .pbr{position:relative;height:4.6cqi;background:var(--panel2);border-radius:1cqi;overflow:hidden;cursor:pointer}
.polrow .pbr i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--pcol,var(--amber));transition:width .45s cubic-bezier(.3,.8,.3,1)}
.polrow .pbr em{position:absolute;left:1.2cqi;top:50%;transform:translateY(-50%);display:flex;align-items:center;font-style:normal;font-weight:900;font-size:2.2cqi;color:#111;background:rgba(255,255,255,.92);padding:.3cqi 1.1cqi;border-radius:99cqi;line-height:1}
.polrow .pbr em span{font-size:1.5cqi;margin-left:.8cqi;opacity:.7}
.polrow:nth-child(2){--pcol:#f6c744}.polrow:nth-child(3){--pcol:#4aa3ff}.polrow:nth-child(4){--pcol:#34d6a0}.polrow:nth-child(5){--pcol:#ff7a6b}.polrow:nth-child(6){--pcol:#b79cff}
.polrow .pcb{display:flex;gap:.5cqi}
.polrow .pcb button{flex:1}
#polov,#qrov,#hlp{position:absolute;inset:0;z-index:70;background:rgba(8,9,11,.9);display:none;align-items:center;justify-content:center}
#polov.open,#qrov.open,#hlp.open{display:flex}
.tbx{width:78cqi;max-height:88%;overflow:auto;background:#14161a;border:.12cqi solid #343a43;border-radius:1.6cqi;padding:2.4cqi 2.8cqi;color:#eee;display:flex;flex-direction:column;gap:1.4cqi}
.tbx h3{font-size:2.6cqi}
.tbx .tlhint{font-size:1.35cqi;color:var(--mute)}
/* QR */
.qrbox svg{display:block;width:100%;height:100%;background:#fff;border-radius:1.2cqi}
.qrbox{width:24cqi;height:24cqi}
.qrcard{width:46cqi;align-items:center;text-align:center}
.qrcard .qrbox{width:30cqi;height:30cqi}
.qrurl{font-size:1.5cqi;font-weight:800;color:var(--amber);word-break:break-all}
.qrcard input{width:100%;text-align:center}
/* 화면 가리기 · 확대 · 도움말 */
.tlblk{position:absolute;inset:0;z-index:85;background:#000;display:none;cursor:pointer}
.tlblk.on{display:block}
.zbadge{position:absolute;left:50%;bottom:1.6cqi;transform:translateX(-50%);z-index:62;background:rgba(16,18,22,.9);color:var(--amber);border:.12cqi solid var(--amber);border-radius:99cqi;padding:.5cqi 1.6cqi;font-size:1.5cqi;font-weight:900;display:none}
.zbadge.on{display:block}
.hlp .tbx{width:70cqi}
.hlp table{width:100%;border-collapse:collapse;font-size:1.6cqi}
.hlp td{padding:.55cqi .6cqi;border-bottom:.1cqi solid #2a2f38;vertical-align:top}
.hlp td:first-child{white-space:nowrap;color:var(--amber);font-weight:900;width:14cqi}
#tmenu{position:fixed;right:14px;bottom:calc(var(--nav-h) + 8px);z-index:300;display:none;background:rgba(10,11,13,.97);border:1px solid #2A2F38;border-radius:12px;padding:8px;box-shadow:0 10px 40px rgba(0,0,0,.6);min-width:240px}
#tmenu.open{display:block}
#tmenu button{display:flex;width:100%;justify-content:space-between;gap:16px;background:none;border:0;color:#EEE;font:600 14px/1 inherit;font-family:inherit;padding:10px 12px;border-radius:8px;cursor:pointer}
#tmenu button:hover{background:#1b1e23;color:var(--amber)}
#tmenu kbd{color:#8E95A1;font:700 12px inherit;font-family:inherit}
@media print{.clk,#clkp,.toast,canvas.pen,.laser,.pbar,#polov,#qrov,#hlp,.tlblk,.zbadge,#tmenu,#toolBtn,.polrow .pcb,.poll .polt button{display:none!important}}

function bell(n){

    for (var i = 0; i < n; i++){ var t0 = ctx.currentTime + .05 + i * 1.1;
      [[880,.28],[1318,.12],[1760,.06]].forEach(function(p){ var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = p[0]; g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(p[1], t0 + .01); g.gain.exponentialRampToValueAtTime(.0008, t0 + 1.0);
        o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0 + 1.05); }); }
  } catch(e){}
}

var polls = {};
function pollGet(id, labels){
  var p = polls[id];
  if (!p || p.labels.join('|') !== labels.join('|')){
    var saved = null; try { saved = JSON.parse(lsGet('poll_' + id) || 'null'); } catch(e){}
    p = polls[id] = { id: id, labels: labels, counts: (saved && saved.length === labels.length) ? saved : labels.map(function(){ return 0; }), boxes: [] };
  }
  return p;
}
function pollBuild(box, id, labels){
  var p = pollGet(id, labels); box.innerHTML = '';
  var top = mk('div', 'polt', '<span>숫자키 1~' + labels.length + ' = +1 · Shift+숫자 = +5 · Alt+숫자 = −1</span><span>합계 <b class="tot">0</b>명 <button type="button" class="tbtn rst" style="margin-left:1cqi">초기화</button></span>', box);
  labels.forEach(function(l, i){
    var r = mk('div', 'polrow', '<span class="plab">' + (i + 1) + '. ' + l + '</span><div class="pbr" data-i="' + i + '"><i></i><em></em></div><span class="pcb"><button type="button" class="tbtn" data-d="-1">−1</button><button type="button" class="tbtn" data-d="1">+1</button><button type="button" class="tbtn" data-d="5">+5</button></span>', box);
  });
  box._p = p; p.boxes = p.boxes.filter(function(b){ return b !== box && document.contains(b); }); p.boxes.push(box);
  var rst = $('.rst', box), rt = null;
  rst.addEventListener('click', function(){ if (rst.dataset.arm){ p.counts = p.counts.map(function(){ return 0; }); rst.textContent = '초기화'; delete rst.dataset.arm; pollSave(p); } else { rst.dataset.arm = 1; rst.textContent = '정말?'; clearTimeout(rt); rt = setTimeout(function(){ rst.textContent = '초기화'; delete rst.dataset.arm; }, 2500); } });
  box.addEventListener('click', function(e){
    var b = e.target.closest('[data-d]'), pb = e.target.closest('.pbr');
    if (b){ b.blur(); pollAdd(p, $$('.polrow', box).indexOf(b.closest('.polrow')), +b.dataset.d); }
    else if (pb) pollAdd(p, +pb.dataset.i, e.shiftKey ? 5 : 1);
  });
  pollPaint(p);
}
function pollSave(p){ lsSet('poll_' + p.id, JSON.stringify(p.counts)); pollPaint(p); }
function pollAdd(p, i, d){ if (i < 0 || i >= p.counts.length) return; p.counts[i] = Math.max(0, p.counts[i] + d); pollSave(p); }
function pollPaint(p){
  var tot = p.counts.reduce(function(a, b){ return a + b; }, 0), mx = Math.max.apply(null, p.counts.concat([1]));
  p.boxes.forEach(function(box){
    $('.tot', box).textContent = tot;
    $$('.pbr', box).forEach(function(pb, i){
      $('i', pb).style.width = (p.counts[i] / Math.max(mx, 1) * 100) + '%';
      $('em', pb).innerHTML = p.counts[i] + '<span>' + (tot ? Math.round(p.counts[i] / tot * 100) : 0) + '%</span>';
    });
  });
}

}

/* ── 키보드 (캡처 단계: 한글 입력 상태에서도 e.code로 동작) ── */

  if (gridOverlay.classList.contains('open')) return;
  var hs = document.getElementById('hush'); if (hs && hs.classList.contains('on')) return;
  var code = e.code, field = inField(e.target);
  if (code === 'Escape'){
    var did = true;
    if (tlblk.classList.contains('on')) tlblk.classList.remove('on');
    else if (hlp.classList.contains('open')) hlp.classList.remove('open');
    else if (qrov.classList.contains('open')) qrov.classList.remove('open');
    else if (polov.classList.contains('open')) polov.classList.remove('open');
    else if (clkp.classList.contains('open')) clkp.classList.remove('open');
    else if (tmenu.classList.contains('open')) tmenu.classList.remove('open');
    else if (pen.on) penOff();
    else if (zoomLvl > 1) zoomSet(1);
    else did = false;
    if (did){ e.preventDefault(); e.stopPropagation(); }
    return;
  }
  if (field || e.ctrlKey || e.metaKey) return;

  var m = /^(?:Digit|Numpad)([0-9])$/.exec(code), used = true;
  if (m && +m[1] >= 1){ var p = pollTarget(); if (p && +m[1] <= p.counts.length) pollAdd(p, +m[1] - 1, e.altKey ? -1 : (e.shiftKey ? 5 : 1)); else used = false; }
  else if (e.altKey) return;
  else if (code === 'KeyC') toggleClk();
  else if (code === 'KeyD') penMode('pen');
  else if (code === 'KeyH') penMode('hl');
  else if (code === 'KeyL') penMode('laser');
  else if (code === 'KeyX' && pen.on) penClear();
  else if (code === 'KeyV') togglePol();
  else if (code === 'KeyQ') toggleQr();
  else if (code === 'KeyB' || code === 'Period') toggleBlk();
  else if (code === 'KeyZ') zoomSet(zoomLvl > 1 ? 1 : 2);
  else if (code === 'Equal' || code === 'NumpadAdd') zoomStep(1);
  else if (code === 'Minus' || code === 'NumpadSubtract') zoomStep(-1);
  else if (e.key === '?' || (code === 'Slash' && e.shiftKey)) toggleHlp();
  else used = false;
  if (used){ e.preventDefault(); e.stopPropagation(); }
}, true);
})();

})();
